services:
  api:
    build: .
    container_name: vgsales-api
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=src/model.pkl
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: vgsales-frontend
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy