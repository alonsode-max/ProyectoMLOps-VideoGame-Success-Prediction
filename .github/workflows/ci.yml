name: MLOps CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  lint-and-test:
    name: Linter & Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias del sistema (OpenMP para LightGBM)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgomp1

      - name: Instalar dependencias de Python y herramientas de QA
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Ejecutar Linter (Ruff)
        run: ruff check src tests --select E,F --ignore E501

      - name: Ejecutar Tests Automáticos (Pytest)
        run: pytest -v

  build-containers:
    name: Validar Build de Imágenes Docker
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Build Docker Backend (FastAPI)
        run: docker build -t vgsales-api:ci .

      - name: Build Docker Frontend (Node.js)
        run: docker build -t vgsales-frontend:ci ./frontend
